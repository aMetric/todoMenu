name: Release

# 推送 v* 标签时自动构建并发布 GitHub Release；
# 也可在 Actions 页面手动触发（workflow_dispatch，可指定 tag）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（留空则使用触发的 ref）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    # 在最低支持版本环境（Sonoma）构建，保证产物兼容 macOS 14+
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 构建 Universal .app（arm64 + x86_64）
        run: ./scripts/bundle.sh

      - name: 校验架构、最低系统版本与签名
        run: |
          lipo -archs build/TodoMenu.app/Contents/MacOS/TodoMenu
          vtool -show-build build/TodoMenu.app/Contents/MacOS/TodoMenu
          plutil -lint build/TodoMenu.app/Contents/Info.plist
          codesign --verify --strict build/TodoMenu.app

      - name: 自测（GUI 冒烟，失败不阻塞）
        continue-on-error: true
        timeout-minutes: 2
        run: ./build/TodoMenu.app/Contents/MacOS/TodoMenu --selftest

      - name: 打包 zip（带版本号）
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/TodoMenu.app/Contents/Info.plist)
          ZIP="TodoMenu-${VERSION}-macOS14+.zip"
          (cd build && zip -r "${ZIP}" TodoMenu.app && mv "${ZIP}" ..)
          echo "ZIP=${ZIP}" >> "${GITHUB_ENV}"

      - name: 制作 DMG（双击即可拖拽安装）
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/TodoMenu.app/Contents/Info.plist)
          DMG="TodoMenu-${VERSION}-macOS14+.dmg"
          STAGING=build/dmg-staging
          rm -rf "$STAGING" build/*.dmg
          mkdir -p "$STAGING"
          cp -R build/TodoMenu.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "TodoMenu" -srcfolder "$STAGING" -ov -format UDZO "build/${DMG}"
          echo "DMG=${DMG}" >> "${GITHUB_ENV}"

      - name: 发布 / 更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi

          cat > /tmp/notes.md <<'EOF'
          ## 下载 Download（无需编译，开箱即用）

          - **推荐**：下载 `.dmg`，双击打开 → 把 TodoMenu 拖入 Applications 即可
          - 或下载 `.zip`：解压后把 TodoMenu.app 拖入 `/Applications`
          - Universal 二进制（Apple Silicon + Intel），macOS 14+
          - 首次打开如被拦截，请**右键 → 打开**

          ## 数据与隐私

          - 数据仅存本机：`~/Library/Application Support/TodoMenu/todos.json`，无任何网络请求
          - 当前为 ad-hoc 签名（未公证）；正式公证需 Apple 开发者账号，后续接入

          ## 变更记录

          详见 [CHANGELOG.md](https://github.com/aMetric/todoMenu/blob/main/CHANGELOG.md)
          EOF

          # GitHub 删除标签会连带删除 Release，且该清理是异步的：
          # 标签刚重建时创建的 Release 可能随后被清掉，因此创建后必须校验并重试。
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release 已存在，更新标题、说明与附件"
              gh release edit "$TAG" --title "TodoMenu $TAG" --notes-file /tmp/notes.md
              gh release upload "$TAG" "$ZIP" "$DMG" --clobber
              break
            fi
            echo "第 $attempt 次尝试创建 Release"
            gh release create "$TAG" "$ZIP" "$DMG" --title "TodoMenu $TAG" --notes-file /tmp/notes.md
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "✅ Release 创建成功"
              break
            fi
            echo "⚠️ 创建后未找到 Release（可能被标签清理竞态删除），10 秒后重试"
            sleep 10
          done
          gh release view "$TAG"
