name: Release

# 推送 v* 标签时自动构建并发布 GitHub Release；
# 也可在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # 在最低支持版本环境（Sonoma）构建，保证产物兼容 macOS 14+
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 构建 Universal .app（arm64 + x86_64）
        run: ./scripts/bundle.sh

      - name: 校验架构、最低系统版本与签名
        run: |
          lipo -archs build/TodoMenu.app/Contents/MacOS/TodoMenu
          vtool -show-build build/TodoMenu.app/Contents/MacOS/TodoMenu
          plutil -lint build/TodoMenu.app/Contents/Info.plist
          codesign --verify --strict build/TodoMenu.app

      - name: 自测（GUI 冒烟，失败不阻塞）
        continue-on-error: true
        timeout-minutes: 2
        run: ./build/TodoMenu.app/Contents/MacOS/TodoMenu --selftest

      - name: 打包 zip（带版本号）
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/TodoMenu.app/Contents/Info.plist)
          ZIP="TodoMenu-${VERSION}-macOS14+.zip"
          (cd build && zip -r "${ZIP}" TodoMenu.app && mv "${ZIP}" ..)
          echo "ZIP_PATH=${ZIP}" >> "${GITHUB_ENV}"

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          name: "TodoMenu ${GITHUB_REF_NAME}"
          files: "${ZIP_PATH}"
          generate_release_notes: true
          body: |
            ## 下载 Download

            - **`${ZIP_PATH}`**：Universal 二进制（Apple Silicon + Intel），macOS 14+
            - 解压后拖入 `/Applications`；首次打开如被拦截，请**右键 → 打开**

            ## 数据与隐私

            - 数据仅存本机：`~/Library/Application Support/TodoMenu/todos.json`，无任何网络请求
            - 当前为 ad-hoc 签名（未公证）；正式公证需 Apple 开发者账号，后续接入

            ## 变更记录

            详见 [CHANGELOG.md](https://github.com/aMetric/todoMenu/blob/main/CHANGELOG.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
