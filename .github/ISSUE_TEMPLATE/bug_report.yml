name: Bug 报告
description: 提交 Bug 报告，帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告 Bug！请尽可能详细地填写以下信息。中英文均可。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么问题？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 按 1、2、3 列出稳定复现的操作步骤
      placeholder: |
        1. 点击菜单栏 TODO
        2. 点击 + 新增待办
        3. 点击"添加"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 在面板底部或 Release 页面查看
      placeholder: 例如 0.2.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: 例如 14.5 (Sonoma)
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: 芯片架构
      options:
        - Apple Silicon
        - Intel
        - 不确定
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 崩溃报告（如适用）
      description: 崩溃时请附上 ~/Library/Logs/DiagnosticReports/ 下对应 .ips 文件内容
      render: shell
  - type: textarea
    id: screenshot
    attributes:
      label: 截图（如适用）
      description: 拖拽图片到此处
