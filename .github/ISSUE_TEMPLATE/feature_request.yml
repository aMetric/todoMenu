name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚使用场景，便于评估。中英文均可。
  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 你想解决什么问题？现在的使用有什么不便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望这个功能长什么样？如何交互？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
      description: 还有哪些做法可以满足需求？
  - type: textarea
    id: context
    attributes:
      label: 补充信息（可选）
      description: 截图、参考应用、相关链接等
